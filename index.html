<!DOCTYPE html>
<html lang="es">
<head>

  <title>Mi primera web</title>
  <!-- Aquí conectamos la hoja de estilos -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <p>Esta es mi primera página web, hecha paso a paso.</p>

  <!-- Contenido principal -->
  <main>

    <section class="tarjeta">

      <p>Pulsa el botón y mira lo que pasa:</p>

  </main>

  <!-- Pie de página -->
  <footer>
